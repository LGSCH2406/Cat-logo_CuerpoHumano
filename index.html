    <style>
        body {
            font-family: 'Sour Gummy', cursive, sans-serif;
        }

        .titulo-principal {
            font-family: 'Black Han Sans', sans-serif;
            text-transform: uppercase;
        }

        @keyframes latido {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        @keyframes flotar {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(1deg); }
        }
        @keyframes saltarin {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes reboteLento {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        @keyframes brillito {
            0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
            50% { opacity: 0.6; transform: scale(1.3) rotate(15deg); }
        }
        @keyframes entrarTarjeta {
            0% { opacity: 0; transform: scale(0.85) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes caerConfeti {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
        @keyframes pulsarBoton {
            0%, 100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.6); }
            50% { box-shadow: 0 0 0 14px rgba(250, 204, 21, 0); }
        }

        .animar-latido { animation: latido 1.2s ease-in-out infinite; }
        .animar-flotar { animation: flotar 3s ease-in-out infinite; }
        .animar-saltarin { animation: saltarin 2s ease-in-out infinite; }
        .animar-rebote { animation: reboteLento 2s ease-in-out infinite; }
        .animar-brillito { animation: brillito 1.8s ease-in-out infinite; }
        .animar-entrada { animation: entrarTarjeta 0.35s ease-out; }
        .animar-pulso { animation: pulsarBoton 2s ease-in-out infinite; }

        html {
            scroll-behavior: smooth;
        }

        /* Botones grandes y cómodos para deditos pequeños */
        .boton-tactil {
            min-width: 64px;
            min-height: 64px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .confeti {
            position: fixed;
            top: -20px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 50;
            animation: caerConfeti linear forwards;
        }

        *:focus-visible {
            outline: 5px solid #FDE047;
            outline-offset: 3px;
        }
    </style>
</head>

        // ---------- Progreso guardado en este dispositivo ----------
        function cargarProgreso() {
            try {
                const guardado = localStorage.getItem('cuerpoHumanoProgreso');
                progreso = guardado ? JSON.parse(guardado) : {};
            } catch (e) {
                progreso = {};
            }
        }
        function guardarProgreso() {
            try {
                localStorage.setItem('cuerpoHumanoProgreso', JSON.stringify(progreso));
            } catch (e) { /* si falla, seguimos sin guardar */ }
        }
        function marcarVisto(catId, idx) {
            if (!progreso[catId]) progreso[catId] = [];
            if (!progreso[catId].includes(idx)) {
                progreso[catId].push(idx);
                guardarProgreso();
                return true; // recién descubierto
            }
            return false;
        }
        function totalDescubiertos() {
            let total = 0;
            categorias.forEach(c => { total += (progreso[c.id] || []).length; });
            return total;
        }
        function totalItems() {
            return categorias.reduce((acc, c) => acc + c.items.length, 0);
        }

        // ---------- Sonido: pequeños tonos alegres, sin archivos externos ----------
        function obtenerAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }
        function reproducirTono(frecuencias, duracion = 0.12) {
            if (!sonidoActivado) return;
            try {
                const ctx = obtenerAudioCtx();
                frecuencias.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    const inicio = ctx.currentTime + i * duracion;
                    gain.gain.setValueAtTime(0.001, inicio);
                    gain.gain.exponentialRampToValueAtTime(0.18, inicio + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, inicio + duracion);
                    osc.connect(gain).connect(ctx.destination);
                    osc.start(inicio);
                    osc.stop(inicio + duracion + 0.02);
                });
            } catch (e) { /* audio no disponible, seguimos sin sonido */ }
        }
        const sonidoToque = () => reproducirTono([520]);
        const sonidoAvance = () => reproducirTono([440, 660]);
        const sonidoDescubrimiento = () => reproducirTono([523, 659, 784]);
        const sonidoCelebracion = () => reproducirTono([523, 659, 784, 1046], 0.14);

        function alternarSonido() {
            sonidoActivado = !sonidoActivado;
            document.getElementById('boton-sonido').innerText = sonidoActivado ? '🔊' : '🔇';
            if (sonidoActivado) sonidoToque();
            if (sonidoActivado && window.speechSynthesis) {
                hablar('¡Sonido activado!');
            } else if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
        }

        // ---------- Voz infantil optimizada ----------
        let vozElegida = null;
        function elegirVozInfantil(voces) {
            const pistas = ['infantil', 'child', 'niñ', 'kid', 'paulina', 'monica', 'mónica', 'sabina', 'helena', 'female', 'mujer', 'google español'];
            let candidata = voces.find(v => v.lang && v.lang.toLowerCase().startsWith('es') && pistas.some(p => v.name.toLowerCase().includes(p)));
            if (!candidata) candidata = voces.find(v => v.lang && v.lang.toLowerCase().startsWith('es'));
            return candidata || null;
        }
        function cargarVoces() {
            if (!window.speechSynthesis) return;
            const voces = window.speechSynthesis.getVoices();
            if (voces && voces.length) vozElegida = elegirVozInfantil(voces);
        }
        if (window.speechSynthesis) {
            cargarVoces();
            window.speechSynthesis.onvoiceschanged = cargarVoces;
        }
        function hablar(texto) {
            if (!sonidoActivado || !window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            if (vozElegida) utterance.voice = vozElegida;
            utterance.rate = 1.0;
            utterance.pitch = 1.6; // Tono más agudo para que suene infantil
            window.speechSynthesis.speak(utterance);
        }
        function leerItemActual() {
            if (indiceActual === null) return;
            const item = categoriaSeleccionada.items[indiceActual];
            sonidoToque();
            hablar(`${item.nombre.replace(/\p{Emoji}/gu, '')}. ${item.subtitulo}. ${item.desc}`);
        }

        // ---------- Confeti de celebración ----------
        function lanzarConfeti() {
            const colores = ['#FDE047', '#F472B6', '#60A5FA', '#4ADE80', '#FB923C'];
            for (let i = 0; i < 40; i++) {
                const pieza = document.createElement('div');
                pieza.className = 'confeti';
                pieza.style.left = Math.random() * 100 + 'vw';
                pieza.style.width = (6 + Math.random() * 6) + 'px';
                pieza.style.height = (6 + Math.random() * 6) + 'px';
                pieza.style.background = colores[Math.floor(Math.random() * colores.length)];
                pieza.style.animationDuration = (1.8 + Math.random() * 1.4) + 's';
                document.body.appendChild(pieza);
                setTimeout(() => pieza.remove(), 3500);
            }
        }

        // ---------- Navegación ----------
        function seleccionarCategoria(catId) {
            categoriaSeleccionada = categorias.find(c => c.id === catId);
            indiceActual = null; // Muestra la lista completa de ítems para elegir
            sonidoAvance();
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => hablar(`${categoriaSeleccionada.nombre.replace(/\p{Emoji}/gu, '')}. ${categoriaSeleccionada.descripcion}`), 300);
        }

        function seleccionarItemDeLista(idx) {
            indiceActual = idx;
            sonidoAvance();
            render();
            // Desliza suavemente hacia abajo para mostrar la info del item seleccionado y permitir escuchar
            setTimeout(() => {
                const tarjetaDetalle = document.getElementById('tarjeta-detalle');
                if (tarjetaDetalle) {
                    tarjetaDetalle.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }, 100);
        }

        function irAItem(nuevoIndice) {
            const total = categoriaSeleccionada.items.length;
            indiceActual = (nuevoIndice + total) % total;
            sonidoAvance();
            render();
        }

        function siguienteItem() { irAItem(indiceActual + 1); }
        function anteriorItem() { irAItem(indiceActual - 1); }

        function volverAlInicio() {
            categoriaSeleccionada = null;
            indiceActual = null;
            sonidoToque();
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function volverAListaCategoria() {
            indiceActual = null;
            sonidoToque();
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ---------- Render ----------
        function render() {
            const container = document.getElementById('app-container');
            const subHeader = document.getElementById('subtitulo-header');
            const footerNav = document.getElementById('footer-nav');
            const textoEstrellas = document.getElementById('texto-estrellas');

            container.innerHTML = '';
            textoEstrellas.innerText = `${totalDescubiertos()}/${totalItems()}`;

            if (!categoriaSeleccionada) {
                // VISTA 1: Categorías principales
                subHeader.innerText = '¡Elige una aventura mágica para comenzar!';
                footerNav.classList.remove('hidden');
                footerNav.querySelector('button[onclick="volverAlInicio()"]').classList.add('invisible');

                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 sm:gap-6 w-full max-w-[95rem] px-2 items-stretch justify-center place-items-center';

                categorias.forEach(cat => {
                    const vistos = (progreso[cat.id] || []).length;
                    const card = document.createElement('button');
                    card.setAttribute('aria-label', `Abrir ${cat.nombre}`);
                    card.className = `boton-tactil bg-gradient-to-br ${cat.bgGradiente} p-5 sm:p-6 md:p-7 rounded-[2rem] border-4 ${cat.bordeColor} shadow-[0_10px_25px_rgba(0,0,0,0.25)] cursor-pointer transition-all transform hover:scale-105 active:scale-95 flex flex-col justify-between text-white relative overflow-hidden w-full text-left`;

                    card.innerHTML = `
                        <div class="absolute -right-3 -bottom-3 text-7xl sm:text-8xl opacity-20 pointer-events-none ${cat.claseAnimacionIcono}">${cat.icono}</div>
                        <div>
                            <span class="text-5xl sm:text-6xl mb-3 block drop-shadow-md ${cat.claseAnimacionIcono}">${cat.icono}</span>
                            <h2 class="text-xl sm:text-2xl md:text-3xl font-bold mb-2 drop-shadow-md leading-tight">${cat.nombre}</h2>
                            <p class="text-white/95 font-medium text-sm sm:text-base md:text-lg drop-shadow">${cat.descripcion}</p>
                        </div>
                        <div class="mt-4 flex items-center justify-between">
                            <span class="bg-black/20 px-3 py-1.5 rounded-full font-bold text-sm sm:text-base">⭐ ${vistos}/${cat.items.length}</span>
                            <span class="bg-white text-purple-900 px-4 py-2 sm:px-5 sm:py-2.5 rounded-full font-bold text-base sm:text-lg shadow-lg flex items-center gap-1.5">
                                ¡Entrar! 🚀
                            </span>
                        </div>
                    `;
                    card.onclick = () => seleccionarCategoria(cat.id);
                    grid.appendChild(card);
                });

                container.appendChild(grid);

            } else if (indiceActual === null) {
                // VISTA 2: Todos los ítems de la categoría elegida para seleccionar
                subHeader.innerText = `${categoriaSeleccionada.nombre} — ¡Elige uno!`;
                footerNav.classList.remove('hidden');
                footerNav.querySelector('button[onclick="volverAlInicio()"]').classList.remove('invisible');

                const wrapper = document.createElement('div');
                wrapper.className = 'w-full max-w-6xl flex flex-col gap-6 items-center px-2 sm:px-4 mx-auto';

                const gridItems = document.createElement('div');
                gridItems.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 w-full';

                categoriaSeleccionada.items.forEach((it, idx) => {
                    const visto = (progreso[categoriaSeleccionada.id] || []).includes(idx);
                    const botonItem = document.createElement('button');
                    botonItem.className = `boton-tactil bg-white hover:bg-yellow-50 p-4 rounded-3xl border-4 ${visto ? 'border-green-400' : 'border-purple-200'} shadow-lg flex flex-col items-center text-center transition-all transform hover:scale-105 active:scale-95 cursor-pointer relative`;

                    botonItem.innerHTML = `
                        ${visto ? '<span class="absolute top-2 right-2 text-xl">⭐</span>' : ''}
                        <div class="w-20 h-20 sm:w-24 sm:h-24 mb-2 flex items-center justify-center p-2 bg-sky-50 rounded-2xl">
                            <img src="${it.img}" alt="${it.nombre}" class="w-full h-full object-contain ${it.animImg}" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/3013/3013745.png';">
                        </div>
                        <span class="text-purple-950 font-bold text-sm sm:text-base leading-tight">${it.nombre}</span>
                        <span class="text-xs text-rose-500 font-bold mt-1 bg-rose-50 px-2 py-0.5 rounded-full">${it.subtitulo}</span>
                    `;
                    botonItem.onclick = () => seleccionarItemDeLista(idx);
                    gridItems.appendChild(botonItem);
                });

                wrapper.appendChild(gridItems);
                container.appendChild(wrapper);

            } else {
                // VISTA 3: Detalle del ítem seleccionado con scroll automático y opción de escuchar
                const item = categoriaSeleccionada.items[indiceActual];
                const total = categoriaSeleccionada.items.length;
                const yaVisto = (progreso[categoriaSeleccionada.id] || []).includes(indiceActual);
                const recienDescubierto = marcarVisto(categoriaSeleccionada.id, indiceActual);
                textoEstrellas.innerText = `${totalDescubiertos()}/${totalItems()}`;

                subHeader.innerText = `${categoriaSeleccionada.nombre} — ${indiceActual + 1} de ${total}`;
                footerNav.classList.remove('hidden');
                footerNav.querySelector('button[onclick="volverAlInicio()"]').classList.remove('invisible');

                if (recienDescubierto) {
                    sonidoDescubrimiento();
                    const completo = (progreso[categoriaSeleccionada.id] || []).length === total;
                    if (completo) {
                        setTimeout(() => { sonidoCelebracion(); lanzarConfeti(); hablar('¡Lo lograste! ¡Descubriste todo!'); }, 250);
                    }
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'w-full max-w-3xl flex flex-col gap-6 items-center px-2 sm:px-4 mx-auto';

                // Botón para regresar al menú completo de la categoría
                const botonVolverLista = document.createElement('button');
                botonVolverLista.className = 'bg-white/90 hover:bg-white text-purple-900 font-bold text-base px-6 py-2.5 rounded-full shadow-md border-3 border-purple-200 flex items-center gap-2 cursor-pointer transition-all active:scale-95';
                botonVolverLista.innerHTML = '📋 Ver todos los ítems';
                botonVolverLista.onclick = volverAListaCategoria;
                wrapper.appendChild(botonVolverLista);

                // Barra de puntitos de progreso
                const puntitos = document.createElement('div');
                puntitos.className = 'flex flex-wrap justify-center gap-1.5 max-w-xl';
                categoriaSeleccionada.items.forEach((it, idx) => {
                    const visto = (progreso[categoriaSeleccionada.id] || []).includes(idx);
                    const punto = document.createElement('span');
                    punto.className = `block rounded-full transition-all ${idx === indiceActual ? 'w-4 h-4 bg-yellow-300 border-2 border-white' : visto ? 'w-3 h-3 bg-white/90' : 'w-3 h-3 bg-white/30'}`;
                    puntitos.appendChild(punto);
                });
                wrapper.appendChild(puntitos);

                // Tarjeta central + flechas grandes
                const filaCentral = document.createElement('div');
                filaCentral.className = 'relative w-full flex items-center justify-center px-7 sm:px-10';

                const flechaIzq = document.createElement('button');
                flechaIzq.setAttribute('aria-label', 'Anterior');
                flechaIzq.className = 'boton-tactil absolute left-0 top-1/2 -translate-y-1/2 -translate-x-1/3 sm:-translate-x-1/2 z-20 bg-white hover:bg-yellow-100 text-purple-900 text-3xl sm:text-4xl w-14 h-14 sm:w-20 sm:h-20 rounded-full shadow-[0_6px_0_rgba(0,0,0,0.2)] border-4 border-purple-200 flex items-center justify-center transition-all active:scale-90 active:shadow-none';
                flechaIzq.innerText = '⬅️';
                flechaIzq.onclick = anteriorItem;

                const flechaDer = document.createElement('button');
                flechaDer.setAttribute('aria-label', 'Siguiente');
                flechaDer.className = 'boton-tactil absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/3 sm:translate-x-1/2 z-20 bg-white hover:bg-yellow-100 text-purple-900 text-3xl sm:text-4xl w-14 h-14 sm:w-20 sm:h-20 rounded-full shadow-[0_6px_0_rgba(0,0,0,0.2)] border-4 border-purple-200 flex items-center justify-center transition-all active:scale-90 active:shadow-none animar-pulso';
                flechaDer.innerText = '➡️';
                flechaDer.onclick = siguienteItem;

                const tarjeta = document.createElement('div');
                tarjeta.id = 'tarjeta-detalle';
                tarjeta.className = 'animar-entrada w-full bg-white p-6 sm:p-10 rounded-[2.5rem] border-8 border-yellow-300 shadow-[0_20px_45px_rgba(0,0,0,0.35)] text-center flex flex-col items-center relative min-w-0';

                const tamañoImg = 'w-40 h-40 sm:w-56 sm:h-56';

                tarjeta.innerHTML = `
                    <div class="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-yellow-400 text-purple-950 font-bold px-5 py-1.5 rounded-full border-4 border-white shadow-md text-sm sm:text-base uppercase tracking-wider whitespace-nowrap">
                        ${yaVisto ? '⭐ ¡Ya lo descubriste!' : '✨ ¡Descubrimiento Mágico!'}
                    </div>

                    <div class="my-5 p-5 bg-sky-50 rounded-full border-4 border-sky-100 shadow-inner flex items-center justify-center">
                        <img src="${item.img}" alt="${item.nombre}" class="${tamañoImg} object-contain drop-shadow-lg ${item.animImg}" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/3013/3013745.png';">
                    </div>

                    <h2 class="text-3xl sm:text-5xl font-bold text-purple-900 mb-2">${item.nombre}</h2>
                    <h3 class="text-xl sm:text-2xl font-bold text-rose-500 bg-rose-50 py-2 px-5 rounded-2xl inline-block mb-4 border-3 border-rose-200">
                        ${item.subtitulo}
                    </h3>

                    <button aria-label="Escuchar la explicación" onclick="leerItemActual()"
                        class="boton-tactil bg-gradient-to-r from-sky-400 to-blue-500 hover:from-sky-300 hover:to-blue-400 text-white font-bold text-xl sm:text-2xl px-6 py-3 rounded-full shadow-[0_5px_0_#1d4ed8] active:translate-y-1 active:shadow-none transition-all flex items-center gap-2 mb-5">
                        🔊 ¡Escúchame!
                    </button>

                    <p class="text-lg sm:text-2xl font-medium leading-relaxed text-gray-700 bg-sky-50 p-5 sm:p-7 rounded-3xl border-3 border-sky-100 shadow-inner w-full">
                        ${item.desc}
                    </p>
                `;

                filaCentral.appendChild(flechaIzq);
                filaCentral.appendChild(tarjeta);
                filaCentral.appendChild(flechaDer);
                wrapper.appendChild(filaCentral);

                container.appendChild(wrapper);

                // Lectura automática de voz al abrir el ítem para los niños
                setTimeout(() => leerItemActual(), 300);
            }
        }

        cargarProgreso();
        render();
    </script>
</body>
</html>
