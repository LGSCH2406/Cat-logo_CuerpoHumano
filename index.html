<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 ¡LA GRAN AVENTURA DEL CUERPO HUMANO! 🌟</title>
    <!-- Tailwind CSS por CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Fuente para el Título Principal: Black Han Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
    
    <!-- Google Fonts: Sour Gummy para el resto del contenido -->
    <link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Sour Gummy', cursive, sans-serif;
        }

        .titulo-principal {
            font-family: 'Black Han Sans', sans-serif;
            text-transform: uppercase;
        }

        @keyframes latido {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        @keyframes flotar {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(1deg); }
        }
        @keyframes saltarin {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes reboteLento {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .animar-latido { animation: latido 1.2s ease-in-out infinite; }
        .animar-flotar { animation: flotar 3s ease-in-out infinite; }
        .animar-saltarin { animation: saltarin 2s ease-in-out infinite; }
        .animar-rebote { animation: reboteLento 2s ease-in-out infinite; }
        
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-cyan-300 via-sky-400 to-indigo-500 p-2 sm:p-4 md:p-6 flex flex-col items-center justify-between selection:bg-yellow-300 overflow-x-hidden">

    <div class="w-full max-w-[95rem] flex flex-col items-center justify-center flex-grow">
        <!-- Barra superior para el botón de regresar mejorado (más divertido, flotante y llamativo) -->
        <div id="footer-nav" class="w-full max-w-7xl flex justify-start mb-3 hidden px-2">
            <button onclick="volverAlInicio()" class="bg-gradient-to-r from-amber-400 to-yellow-300 hover:from-amber-300 hover:to-yellow-200 text-purple-950 font-bold text-lg md:text-xl px-6 py-3.5 rounded-full shadow-[0_6px_0_#b45309] hover:shadow-[0_8px_0_#b45309] active:translate-y-1.5 active:shadow-[0_2px_0_#b45309] transition-all cursor-pointer border-4 border-white flex items-center gap-3 animar-rebote">
                <span class="text-2xl">⬅️</span> <span class="tracking-wide">¡Volver a Categorías!</span> 🚀
            </button>
        </div>

        <!-- Encabezado adaptable para evitar que se oculten los emojis -->
        <div class="text-center mb-4 mt-2 animar-saltarin w-full flex flex-col items-center px-1">
            <div class="flex items-center justify-center gap-1 sm:gap-3 flex-wrap md:flex-nowrap w-full px-1">
                <span class="text-3xl sm:text-4xl md:text-6xl animar-flotar shrink-0">🚀</span>
                <h1 class="titulo-principal text-xl sm:text-3xl md:text-5xl lg:text-6xl text-yellow-300 drop-shadow-[0_3px_3px_rgba(0,0,0,0.4)] tracking-wide text-center">
                    ¡MI ASOMBROSO CUERPO!
                </h1>
                <span class="text-3xl sm:text-4xl md:text-6xl animar-flotar shrink-0">🌈</span>
            </div>
            <p id="subtitulo-header" class="text-base sm:text-xl md:text-3xl text-white font-medium drop-shadow-md mt-2 px-2">
                ¡Toca una aventura mágica para explorar! 🎈
            </p>
        </div>

        <!-- Contenedor Principal Dinámico (Centrado verticalmente) -->
        <div id="app-container" class="w-full flex flex-col items-center justify-center my-auto">
            <!-- Vistas dinámicas -->
        </div>
    </div>

    <!-- Pie de página discreto -->
    <div class="text-white/80 font-medium text-sm mt-4">
        🌟 Aprendiendo con diversión 🌟
    </div>

    <script>
        const categorias = [
            {
                id: 'organos',
                nombre: '🦸‍♂️ Órganos Superhéroes',
                descripcion: '¡Las máquinas mágicas que trabajan por dentro de ti!',
                bgGradiente: 'from-pink-400 to-rose-500',
                bordeColor: 'border-pink-200',
                icono: '❤️',
                claseAnimacionIcono: 'animar-latido',
                items: [
                    { nombre: '❤️ El Corazón', subtitulo: 'El motor que late y late', desc: 'Late sin parar para mandar sangrecita mágica a todo tu cuerpo. ¡Pón la manito en tu pecho y siéntelo!', img: 'IMG/ORGANOS_SUPERHEROES/corazon.png', animImg: 'animar-latido' },
                    { nombre: '🫁 Los Pulmones', subtitulo: 'Globos que se inflan', desc: 'Guardan aire fresco cuando respiras hondo. ¡Inhala inflando la panza y sóplalo despacito!', img: 'IMG/ORGANOS_SUPERHEROES/pulmones.png', animImg: 'animar-latido' },
                    { nombre: '🧠 El Cerebro', subtitulo: 'El jefe de la cabecita', desc: 'La súper computadora que te ayuda a pensar, imaginar, bailar y portarte bien.', img: 'IMG/ORGANOS_SUPERHEROES/cerebro.png', animImg: 'animar-latido' },
                    { nombre: '🍔 El Estómago', subtitulo: 'La licuadora mágica', desc: 'Tritura la rica comida para convertirla en súper energía para correr.', img: 'IMG/ORGANOS_SUPERHEROES/estomago.png', animImg: 'animar-latido' },
                    { nombre: '🧽 El Hígado', subtitulo: 'El gran filtro', desc: 'Limpia nuestro cuerpo como un superhéroe silencioso.', img: 'IMG/ORGANOS_SUPERHEROES/higado.png', animImg: 'animar-latido' },
                    { nombre: '💧 Los Riñones', subtitulo: 'Los coladores de agua', desc: 'Filtran el agüita y separan lo que ya no sirve.', img: 'IMG/ORGANOS_SUPERHEROES/riñones.png', animImg: 'animar-latido' },
                    { nombre: '🎢 El Intestino Delgado', subtitulo: 'El tobogán de energía', desc: 'Absorbe todos los nutrientes de tus alimentos favoritos.', img: 'IMG/ORGANOS_SUPERHEROES/indelgado.png', animImg: 'animar-latido' },
                    { nombre: '🛤️ El Intestino Grueso', subtitulo: 'El caminito final', desc: 'La última parte del recorrido de la comidita.', img: 'IMG/ORGANOS_SUPERHEROES/igrueso.png', animImg: 'animar-latido' },
                    { nombre: '🎈 La Vejiga', subtitulo: 'El globito del pipí', desc: 'Guarda el agüita un ratito hasta que vas al baño.', img: 'IMG/ORGANOS_SUPERHEROES/vejiga.png', animImg: 'animar-latido' },
                    { nombre: '🛡️ El Bazo', subtitulo: 'El guardián protector', desc: 'Ayuda a defendernos de los microbios malos.', img: 'IMG/ORGANOS_SUPERHEROES/vaso.png', animImg: 'animar-latido' }
                ]
            },
            {
                id: 'huesos',
                nombre: '🏰 Castillo de Huesos',
                descripcion: '¡El esqueleto fuerte y divertido que te sostiene!',
                bgGradiente: 'from-purple-400 to-indigo-600',
                bordeColor: 'border-purple-200',
                icono: '🦴',
                claseAnimacionIcono: 'animar-latido',
                items: [
                    { nombre: '🪖 El Cráneo', subtitulo: 'El casco protector', desc: 'Protege al cerebro como un casco de astronauta espacial.', img: 'IMG/HUESOS/craneo.png', animImg: 'animar-latido' },
                    { nombre: '🚂 La Columna Vertebral', subtitulo: 'El trencito de la espalda', desc: 'Huesitos unidos que te dejan estar derechito.', img: 'IMG/HUESOS/columnavertebral.png', animImg: 'animar-latido' },
                    { nombre: '🦴 Las Costillas', subtitulo: 'La casita del pecho', desc: 'Protegen al corazón y a los pulmones.', img: 'IMG/HUESOS/costillas.png', animImg: 'animar-latido' },
                    { nombre: '🗣️ La Mandíbula', subtitulo: 'El hueso hablador', desc: 'Se mueve cada vez que hablas, cantas o masticas.', img: 'IMG/HUESOS/mandibula.png', animImg: 'animar-latido' },
                    { nombre: '🌉 La Clavícula', subtitulo: 'El puente del hombro', desc: 'Une tu bracito con el tronco.', img: 'IMG/HUESOS/clavicula.png', animImg: 'animar-latido' },
                    { nombre: '🦋 El Omóplato', subtitulo: 'La alita de la espalda', desc: 'Hueso plano atrás de tus hombros.', img: 'IMG/HUESOS/omoplato.png', animImg: 'animar-latido' },
                    { nombre: '💪 El Húmero', subtitulo: 'El hueso fuerte del brazo', desc: 'Sostiene tu brazo por arriba.', img: 'IMG/HUESOS/humero.png', animImg: 'animar-latido' },
                    { nombre: '🤝 Cúbito y Radio', subtitulo: 'Los gemelos del antebrazo', desc: 'Huesitos que te dejan girar la mano.', img: 'IMG/HUESOS/cubitoyradio.png', animImg: 'animar-latido' },
                    { nombre: '🖐️ Huesitos de la Mano', subtitulo: 'Nudillos traviesos', desc: 'Muchos huesitos pequeños para tocar y agarrar cosas.', img: 'IMG/HUESOS/huesitosdelamano.png', animImg: 'animar-latido' },
                    { nombre: '👖 La Pelvis', subtitulo: 'La base de la cintura', desc: 'Sostiene tu cuerpo firme al sentarte.', img: 'IMG/HUESOS/pelvis.png', animImg: 'animar-latido' },
                    { nombre: '🦵 El Fémur', subtitulo: 'El gigante de la pierna', desc: 'El hueso más largo y fuerte de todo tu cuerpo.', img: 'IMG/HUESOS/femur.png', animImg: 'animar-latido' },
                    { nombre: '🛡️ La Rótula', subtitulo: 'El escudo de la rodilla', desc: 'Protege tu rodilla cuando juegas.', img: 'IMG/HUESOS/rotula.png', animImg: 'animar-latido' },
                    { nombre: '🥖 La Tibia', subtitulo: 'El hueso de la pantorrilla', desc: 'El soporte principal de tu pierna baja.', img: 'IMG/HUESOS/tibia.png', animImg: 'animar-latido' },
                    { nombre: '🥢 El Peroné', subtitulo: 'El compañero flaquito', desc: 'Ayuda a la tibia a mantener el equilibrio.', img: 'IMG/HUESOS/perone.png', animImg: 'animar-latido' },
                    { nombre: '🦶 Huesitos del Pie', subtitulo: 'Impulsores de saltos', desc: 'Te ayudaran a caminar y saltar sin parar.', img: 'IMG/HUESOS/huesitospie.png', animImg: 'animar-latido' }
                ]
            },
            {
                id: 'sentidos',
                nombre: '👁️ Los 5 Super Sentidos',
                descripcion: '¡Las ventanas mágicas para descubrir el mundo!',
                bgGradiente: 'from-amber-400 to-orange-500',
                bordeColor: 'border-amber-200',
                icono: '🌟',
                claseAnimacionIcono: 'animar-latido',
                items: [
                    { nombre: '👁️ Los Ojos', subtitulo: 'La ventana de la vista', desc: 'Te dejan ver los colores, el cielo y las sonrisas.', img: 'IMG/SENTIDOS/ojos.png', animImg: 'animar-latido' },
                    { nombre: '👂 Las Orejas', subtitulo: 'Antenitas del oído', desc: 'Escuchan la música, los cuentos y las risas.', img: 'IMG/SENTIDOS/orejas.png', animImg: 'animar-latido' },
                    { nombre: '👃 La Nariz', subtitulo: 'El radar de olores', desc: 'Huele las flores, el jabón y las ricas galletas.', img: 'IMG/SENTIDOS/nariz.png', animImg: 'animar-latido' },
                    { nombre: '👅 La Lengua', subtitulo: 'Explorador de sabores', desc: 'Siente si algo es dulce, salado o ácido.', img: 'IMG/SENTIDOS/lengua.png', animImg: 'animar-latido' },
                    { nombre: '✋ La Piel', subtitulo: 'La gran cobijita táctil', desc: 'Siente el calorcito, el frío y las caricias.', img: 'IMG/SENTIDOS/tacto.png', animImg: 'animar-latido' }
                ]
            },
            {
                id: 'musculos',
                nombre: '🏃‍♂️ Músculos y Movimiento',
                descripcion: '¡Motores geniales para saltar, correr y bailar!',
                bgGradiente: 'from-emerald-400 to-teal-600',
                bordeColor: 'border-emerald-200',
                icono: '⚡',
                claseAnimacionIcono: 'animar-latido',
                items: [
                    { nombre: '💪 Los Bíceps', subtitulo: 'Músculos de fuerza', desc: 'Los que sacas al flexionar el brazo como un fortachón.', img: 'IMG/MUSCULOS/biceps.png', animImg: 'animar-latido' },
                    { nombre: '🍫 Los Abdominales', subtitulo: 'La pancita firme', desc: 'Se ponen duros al reírnos a carcajadas.', img: 'IMG/MUSCULOS/abdominales.png', animImg: 'animar-latido' },
                    { nombre: '🦵 Los Cuádriceps', subtitulo: 'Fuerza en los muslos', desc: 'Te impulsan a correr rapidísimo en el parque.', img: 'IMG/MUSCULOS/cuadriceps.png', animImg: 'animar-latido' },
                    { nombre: '🪑 Los Glúteos', subtitulo: 'Cojincitos cómodos', desc: 'Te ayudan a sentarte y levantarte.', img: 'IMG/MUSCULOS/gluteos.png', animImg: 'animar-latido' },
                    { nombre: '😁 Músculos de la Cara', subtitulo: 'Creadores de gestos', desc: 'Los que mueven tus labios para sonreír o hacer muecas.', img: 'IMG/MUSCULOS/musculoscara.png', animImg: 'animar-latido' },
                    { nombre: '👅 La Lengua (Músculo)', subtitulo: 'El más flexible', desc: 'Un músculo sin descanso que te ayuda a hablar.', img: 'IMG/SENTIDOS/lengua.png', animImg: 'animar-latido' },
                    { nombre: '🦘 Los Gemelos', subtitulo: 'Resortes de pantorrilla', desc: 'Te ayudan a saltar muy alto como un conejito.', img: 'IMG/MUSCULOS/gemelos.png', animImg: 'animar-latido' },
                    { nombre: '🧶 Los Tendones', subtitulo: 'Cuerdas elásticas', desc: 'Unen tus músculos con los huesos para moverte.', img: 'IMG/MUSCULOS/tendones.png', animImg: 'animar-latido' }
                ]
            },
            {
                id: 'liquidos',
                nombre: '🩸 Pequeños Exploradores',
                descripcion: '¡Líquidos y detalles asombrosos de tu cuerpo!',
                bgGradiente: 'from-blue-400 to-cyan-600',
                bordeColor: 'border-blue-200',
                icono: '💧',
                claseAnimacionIcono: 'animar-latido',
                items: [
                    { nombre: '🩸 La Sangre', subtitulo: 'El río rojo viajero', desc: 'Lleva oxígeno y vida por todo tu cuerpo.', img: 'IMG/EXTRAS/sangre.png', animImg: 'animar-latido' },
                    { nombre: '🚚 Glóbulos Rojos', subtitulo: 'Camioneros de oxígeno', desc: 'Reparten aire fresco a cada rincón.', img: 'IMG/EXTRAS/globulosrojos.png', animImg: 'animar-latido' },
                    { nombre: '👮‍♂️ Glóbulos Blancos', subtitulo: 'Soldaditos valientes', desc: 'Luchan y defienden tu cuerpo contra los microbios.', img: 'IMG/EXTRAS/globulosblancos.png', animImg: 'animar-latido' },
                    { nombre: '🧱 Las Plaquetas', subtitulo: 'Pequeños albañiles', desc: 'Tapan rapidísimo cualquier heridita para sanarla.', img: 'IMG/EXTRAS/plaquetas.png', animImg: 'animar-latido' },
                    { nombre: '🧢 El Pelo', subtitulo: 'Sombrerito natural', desc: 'Abriga y cuida tu cabecita del frío.', img: 'IMG/EXTRAS/pelo.png', animImg: 'animar-latido' },
                    { nombre: '🛡️ Las Uñas', subtitulo: 'Escudos de los dedos', desc: 'Protegen las puntas de tus deditos.', img: 'IMG/EXTRAS/uñas.png', animImg: 'animar-latido' },
                    { nombre: '🔘 El Ombligo', subtitulo: 'Botoncito de recuerdo', desc: 'La marca de cuando estabas protegido en la pancita de mamá.', img: 'IMG/EXTRAS/ombligo.png', animImg: 'animar-latido' }
                ]
            }
        ];

        let categoriaSeleccionada = null;
        let itemSeleccionado = null;

        function seleccionarCategoria(catId) {
            categoriaSeleccionada = categorias.find(c => c.id === catId);
            itemSeleccionado = categoriaSeleccionada.items[0];
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function seleccionarItem(index) {
            itemSeleccionado = categoriaSeleccionada.items[index];
            render();
            const tarjetaInfo = document.getElementById('tarjeta-detalle');
            if (tarjetaInfo) {
                tarjetaInfo.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function volverAlInicio() {
            categoriaSeleccionada = null;
            itemSeleccionado = null;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function render() {
            const container = document.getElementById('app-container');
            const subHeader = document.getElementById('subtitulo-header');
            const footerNav = document.getElementById('footer-nav');

            container.innerHTML = '';

            if (!categoriaSeleccionada) {
                subHeader.innerText = "¡Elige una aventura mágica para comenzar!";
                footerNav.classList.add('hidden');

                const grid = document.createElement('div');
                grid.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 sm:gap-6 w-full max-w-[95rem] px-2 items-center justify-center place-items-center";

                categorias.forEach(cat => {
                    const card = document.createElement('div');
                    card.className = `bg-gradient-to-br ${cat.bgGradiente} p-5 sm:p-6 md:p-7 rounded-[2rem] border-4 ${cat.bordeColor} shadow-[0_10px_25px_rgba(0,0,0,0.25)] cursor-pointer transition-all transform hover:scale-105 active:scale-95 flex flex-col justify-between text-white relative overflow-hidden w-full`;
                    
                    card.innerHTML = `
                        <div class="absolute -right-3 -bottom-3 text-7xl sm:text-8xl opacity-20 pointer-events-none ${cat.claseAnimacionIcono}">${cat.icono}</div>
                        <div>
                            <span class="text-5xl sm:text-6xl mb-3 block drop-shadow-md ${cat.claseAnimacionIcono}">${cat.icono}</span>
                            <h2 class="text-xl sm:text-2xl md:text-3xl font-bold mb-2 drop-shadow-md leading-tight">${cat.nombre}</h2>
                            <p class="text-white/95 font-medium text-sm sm:text-base md:text-lg drop-shadow">${cat.descripcion}</p>
                        </div>
                        <div class="mt-4 flex items-center justify-end">
                            <span class="bg-white text-purple-900 px-4 py-2 sm:px-5 sm:py-2.5 rounded-full font-bold text-base sm:text-lg shadow-lg flex items-center gap-1.5">
                                ¡Entrar! 🚀
                            </span>
                        </div>
                    `;
                    card.onclick = () => seleccionarCategoria(cat.id);
                    grid.appendChild(card);
                });

                container.appendChild(grid);

            } else {
                subHeader.innerText = `¡Explorando: ${categoriaSeleccionada.nombre}!`;
                footerNav.classList.remove('hidden');

                const wrapper = document.createElement('div');
                wrapper.className = "w-full max-w-7xl flex flex-col gap-8 items-center px-4 mx-auto";

                // Cuadrícula limpia y estructurada de 3 columnas para PC con alineación uniforme y diseño vertical idéntico al móvil
                const subGrid = document.createElement('div');
                subGrid.className = "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5 w-full";

                categoriaSeleccionada.items.forEach((item, idx) => {
                    const esActivo = itemSeleccionado.nombre === item.nombre;
                    const btn = document.createElement('button');
                    
                    btn.className = `flex flex-col items-center text-center p-6 rounded-3xl font-bold shadow-lg cursor-pointer transition-all transform hover:scale-[1.02] active:scale-95 border-4 w-full h-full justify-between ${
                        esActivo 
                            ? 'bg-yellow-300 text-purple-950 border-white ring-4 ring-yellow-400 scale-[1.02] shadow-xl' 
                            : 'bg-white/95 text-purple-900 border-white/90 hover:bg-white'
                    }`;
                    
                    btn.innerHTML = `
                        <div class="w-28 h-28 sm:w-32 sm:h-32 shrink-0 flex items-center justify-center bg-sky-50 rounded-2xl p-2 shadow-inner border-2 border-sky-100 mx-auto mb-4">
                            <img src="${item.img}" alt="${item.nombre}" class="w-full h-full object-contain drop-shadow ${item.animImg}" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/3013/3013745.png';">
                        </div>
                        <div class="flex flex-col flex-grow items-center justify-center w-full">
                            <span class="text-2xl sm:text-3xl leading-tight font-bold">${item.nombre}</span>
                            <span class="text-base sm:text-lg font-medium text-purple-700 opacity-90 mt-2">${item.subtitulo}</span>
                        </div>
                    `;
                    
                    btn.onclick = () => seleccionarItem(idx);
                    subGrid.appendChild(btn);
                });

                wrapper.appendChild(subGrid);

                const tarjeta = document.createElement('div');
                tarjeta.id = 'tarjeta-detalle';
                tarjeta.className = `w-full max-w-3xl bg-white p-8 sm:p-10 md:p-14 rounded-[3rem] border-8 border-yellow-300 shadow-[0_20px_45px_rgba(0,0,0,0.35)] text-center transition-all duration-300 relative mt-6 flex flex-col items-center scroll-mt-6`;
                
                const tamañoImg = 'w-48 h-48 sm:w-60 sm:h-60 md:w-72 md:h-72';

                tarjeta.innerHTML = `
                    <div class="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-yellow-400 text-purple-950 font-bold px-6 py-2 rounded-full border-4 border-white shadow-md text-base sm:text-lg uppercase tracking-wider">
                        ✨ ¡Descubrimiento Mágico! ✨
                    </div>
                    
                    <div class="my-6 p-6 bg-sky-50 rounded-full border-6 border-sky-100 shadow-inner flex items-center justify-center">
                        <img src="${itemSeleccionado.img}" alt="${itemSeleccionado.nombre}" class="${tamañoImg} object-contain drop-shadow-lg ${itemSeleccionado.animImg}" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/3013/3013745.png';">
                    </div>

                    <h2 class="text-4xl sm:text-5xl md:text-6xl font-bold text-purple-900 mb-3">${itemSeleccionado.nombre}</h2>
                    <h3 class="text-2xl sm:text-3xl md:text-4xl font-bold text-rose-500 bg-rose-50 py-3 px-6 rounded-2xl inline-block mb-6 border-3 border-rose-200">
                        ${itemSeleccionado.subtitulo}
                    </h3>
                    <p class="text-2xl sm:text-3xl md:text-4xl font-medium leading-relaxed text-gray-700 bg-sky-50 p-6 sm:p-8 md:p-10 rounded-3xl border-3 border-sky-100 shadow-inner w-full">
                        ${itemSeleccionado.desc}
                    </p>
                `;

                wrapper.appendChild(tarjeta);
                container.appendChild(wrapper);
            }
        }

        render();
    </script>
</body>
</html>
