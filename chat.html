<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤖 ¡Asistente Mágico de Gemini! 🌟</title>
    <!-- Tailwind CSS por CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Sour Gummy', cursive, sans-serif; }
        .titulo-principal { font-family: 'Black Han Sans', sans-serif; text-transform: uppercase; }
        @keyframes flotar {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(1deg); }
        }
        .animar-flotar { animation: flotar 3s ease-in-out infinite; }
        @keyframes latido {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .animar-voz { animation: latido 0.8s ease-in-out infinite; }
        .boton-tactil { min-width: 64px; min-height: 64px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        *:focus-visible { outline: 5px solid #FDE047; outline-offset: 3px; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-cyan-300 via-sky-400 to-indigo-500 p-2 sm:p-4 md:p-6 flex flex-col items-center justify-between selection:bg-yellow-300">

    <div class="w-full max-w-4xl flex flex-col items-center justify-between flex-grow">
        
        <!-- Barra superior: Volver al Índice -->
        <div class="w-full flex justify-between items-center mb-3 px-2">
            <a href="index.html" aria-label="Volver al inicio"
                class="boton-tactil bg-gradient-to-r from-amber-400 to-yellow-300 hover:from-amber-300 hover:to-yellow-200 text-purple-950 font-bold text-lg md:text-2xl px-5 py-3 rounded-full shadow-[0_6px_0_#b45309] active:translate-y-1.5 transition-all flex items-center gap-2 border-4 border-white">
                <span class="text-3xl">🏠</span> <span class="tracking-wide">¡Volver al Juego!</span>
            </a>
            <div class="bg-white/90 text-purple-900 font-bold text-lg px-5 py-3 rounded-full shadow-lg border-4 border-white">
                🤖 Chat Mágico Gemini
            </div>
        </div>

        <!-- Encabezado del Chat -->
        <div class="text-center mb-3 w-full">
            <h1 class="titulo-principal text-2xl sm:text-4xl text-yellow-300 drop-shadow-[0_3px_3px_rgba(0,0,0,0.4)]">
                ¡Pregúntale a Doctor Cito! 🧠✨
            </h1>
            <p class="text-white text-base sm:text-xl font-medium drop-shadow mt-1">
                ¡Escribe, dibuja o habla con Doctor Cito sobre tu cuerpo!
            </p>
        </div>

        <!-- Contenedor de Mensajes -->
        <div id="chat-container" class="w-full flex-grow bg-white/90 backdrop-blur rounded-[2.5rem] border-8 border-yellow-300 shadow-2xl p-4 sm:p-6 mb-4 flex flex-col gap-4 overflow-y-auto max-h-[50vh] sm:max-h-[58vh]">
            <!-- Mensaje de bienvenida inicial del bot -->
            <div class="flex items-start gap-3">
                <div class="bg-purple-600 text-white p-3 rounded-full text-2xl shadow-md">🤖</div>
                <div class="bg-purple-100 text-purple-950 p-4 rounded-3xl rounded-tl-none border-2 border-purple-200 shadow-sm text-base sm:text-xl max-w-[80%] font-medium">
                    ¡Hola amiguito! Soy Doctor Cito. Puedes escribirme, pedirme dibujos o tocar el micrófono 🎙️ para hablar conmigo. 🎨🌟
                </div>
            </div>
        </div>

        <!-- Formulario de Entrada (Pregunta, Imagen o Voz) -->
        <div class="w-full bg-white p-3 sm:p-4 rounded-3xl border-4 border-yellow-300 shadow-xl flex flex-col sm:flex-row gap-2">
            <input type="text" id="userInput" placeholder="Ej: ¿Qué hacen los pulmones? o Dibuja un corazón" 
                class="flex-grow bg-sky-50 border-3 border-sky-200 rounded-2xl px-4 py-3 text-purple-950 placeholder-purple-300 font-medium text-base sm:text-xl focus:outline-none focus:border-yellow-400">
            
            <div class="flex gap-2 justify-end flex-wrap">
                <button onclick="enviarMensaje(false)" title="Preguntar texto" class="bg-gradient-to-r from-sky-400 to-blue-500 hover:from-sky-300 text-white font-bold px-4 py-3 rounded-2xl shadow-md text-base sm:text-lg cursor-pointer transition-all active:scale-95 flex items-center gap-1">
                    💬 Preguntar
                </button>
                <button onclick="enviarMensaje(true)" title="Crear Imagen" class="bg-gradient-to-r from-pink-400 to-rose-500 hover:from-pink-300 text-white font-bold px-4 py-3 rounded-2xl shadow-md text-base sm:text-lg cursor-pointer transition-all active:scale-95 flex items-center gap-1">
                    🎨 Imagen
                </button>
                <button id="btnVoz" onclick="iniciarEscuchaVoz()" title="Hablar por voz" class="bg-gradient-to-r from-emerald-400 to-green-500 hover:from-emerald-300 text-white font-bold px-4 py-3 rounded-2xl shadow-md text-base sm:text-lg cursor-pointer transition-all active:scale-95 flex items-center gap-1">
                    🎙️ Hablar
                </button>
            </div>
        </div>

    </div>

    <!-- Pie de página -->
    <div class="text-white/80 font-medium text-sm mt-3">
        🌟 Impulsado por Google Gemini 🌟
    </div>

    <!-- Lógica de conexión con la API de Gemini y Reconocimiento de Voz -->
    <script>
        const GEMINI_API_KEY = "AIzaSyA_placeholder_key_demo_local_system";

        async function enviarMensaje(esImagen, textoForzado = null) {
            const input = document.getElementById('userInput');
            const texto = textoForzado ? textoForzado : input.value.trim();
            if (!texto) return;

            const chatContainer = document.getElementById('chat-container');

            // 1. Mostrar mensaje del usuario
            const userBubble = document.createElement('div');
            userBubble.className = 'flex items-start gap-3 justify-end';
            userBubble.innerHTML = `
                <div class="bg-yellow-100 text-purple-950 p-4 rounded-3xl rounded-tr-none border-2 border-yellow-200 shadow-sm text-base sm:text-xl max-w-[80%] font-medium">
                    ${escapeHtml(texto)}
                </div>
                <div class="bg-yellow-400 text-purple-950 p-3 rounded-full text-2xl shadow-md">🧒</div>
            `;
            chatContainer.appendChild(userBubble);
            input.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 2. Mostrar indicador de carga personalizado
            const loadingId = 'loading-' + Date.now();
            const botLoading = document.createElement('div');
            botLoading.id = loadingId;
            botLoading.className = 'flex items-start gap-3';
            
            const mensajeCarga = esImagen 
                ? "🎨 ¡Creando tu dibujo mágico, espera un poquito..." 
                : "Mágicamente pensando...";

            botLoading.innerHTML = `
                <div class="bg-purple-600 text-white p-3 rounded-full text-2xl shadow-md">🤖</div>
                <div class="bg-purple-100 text-purple-950 p-4 rounded-3xl rounded-tl-none border-2 border-purple-200 shadow-sm text-base sm:text-xl font-medium animar-flotar">
                    ${mensajeCarga} ✨
                </div>
            `;
            chatContainer.appendChild(botLoading);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                if (esImagen) {
                    const respuestaImg = await generarImagenGemini(texto);
                    document.getElementById(loadingId).remove();

                    const botBubble = document.createElement('div');
                    botBubble.className = 'flex items-start gap-3';
                    botBubble.innerHTML = `
                        <div class="bg-purple-600 text-white p-3 rounded-full text-2xl shadow-md">🤖</div>
                        <div class="bg-purple-100 text-purple-950 p-4 rounded-3xl rounded-tl-none border-2 border-purple-200 shadow-sm text-base sm:text-xl max-w-[80%] font-medium flex flex-col gap-2">
                            <p>¡Mira la imagen mágica que creé para ti sobre: <b>${escapeHtml(texto)}</b>!</p>
                            <img src="${respuestaImg}" alt="${escapeHtml(texto)}" class="rounded-2xl border-4 border-white shadow-md max-h-64 object-contain mx-auto">
                        </div>
                    `;
                    chatContainer.appendChild(botBubble);
                    reproducirVoz(`¡Mira la imagen mágica que creé para ti sobre ${texto}!`);
                } else {
                    const respuestaTexto = await consultarTextoGemini(texto);
                    document.getElementById(loadingId).remove();

                    const botBubble = document.createElement('div');
                    botBubble.className = 'flex items-start gap-3';
                    botBubble.innerHTML = `
                        <div class="bg-purple-600 text-white p-3 rounded-full text-2xl shadow-md">🤖</div>
                        <div class="bg-purple-100 text-purple-950 p-4 rounded-3xl rounded-tl-none border-2 border-purple-200 shadow-sm text-base sm:text-xl max-w-[80%] font-medium">
                            ${escapeHtml(respuestaTexto)}
                        </div>
                    `;
                    chatContainer.appendChild(botBubble);
                    reproducirVoz(respuestaTexto);
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                
                const respuestaSimulada = obtenerRespuestaEducativaMock(texto);

                const botBubble = document.createElement('div');
                botBubble.className = 'flex items-start gap-3';
                botBubble.innerHTML = `
                    <div class="bg-purple-600 text-white p-3 rounded-full text-2xl shadow-md">🤖</div>
                    <div class="bg-purple-100 text-purple-950 p-4 rounded-3xl rounded-tl-none border-2 border-purple-200 shadow-sm text-base sm:text-xl font-medium">
                        ${escapeHtml(respuestaSimulada)}
                    </div>
                `;
                chatContainer.appendChild(botBubble);
                reproducirVoz(respuestaSimulada);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function consultarTextoGemini(prompt) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            const promptInfantil = `Eres Doctor Cito, un asistente virtual muy tierno, alegre y educativo especializado en explicar anatomía y el cuerpo humano a niños pequeños de 4 a 5 años de forma muy divertida, sencilla y cariñosa. Responde en máximo dos oraciones con palabras súper fáciles: ${prompt}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptInfantil }] }] })
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            return data.candidates[0].content.parts[0].text;
        }

        async function generarImagenGemini(prompt) {
            await new Promise(resolve => setTimeout(resolve, 1500));
            return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt + " children educational style cute colorful cartoon anatomy preschool friendly")}`;
        }

        function obtenerRespuestaEducativaMock(texto) {
            const t = texto.toLowerCase();
            if (t.includes('corazon') || t.includes('latir') || t.includes('corazón')) {
                return "¡El corazón late como un tambor feliz en tu pecho para darte mucha energía y correr a jugar!";
            } else if (t.includes('pulmon') || t.includes('pulmón') || t.includes('respirar') || t.includes('aire')) {
                return "¡Los pulmones son como dos globitos mágicos dentro de tu pecho que se inflan al tomar aire!";
            } else if (t.includes('cerebro') || t.includes('pensar')) {
                return "¡Tu cerebro es el rey mago de tu cabeza que te ayuda a aprender, jugar y soñar!";
            } else if (t.includes('estomago') || t.includes('comida') || t.includes('estómago')) {
                return "¡Tu pancita guarda la rica comidita para transformarla en súper poderes y saltar muy alto!";
            } else {
                return `¡Qué pregunta tan divertida sobre ${texto}! Tu cuerpito es una obra de arte mágica y perfecta.`;
            }
        }

        // --- FUNCIONES DE VOZ (Reconocimiento y Síntesis) ---
        function iniciarEscuchaVoz() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("¡Ups! Tu navegador no soporta el reconocimiento de voz. Prueba usando Google Chrome.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            const btnVoz = document.getElementById('btnVoz');
            btnVoz.classList.add('animar-voz', 'bg-red-500');
            btnVoz.innerText = "🎙️ Escuchando...";

            recognition.start();

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                document.getElementById('userInput').value = speechResult;
                restaurarBotonVoz();
                enviarMensaje(false, speechResult); // Enviar automáticamente lo que habló
            };

            recognition.onerror = function(event) {
                restaurarBotonVoz();
            };

            recognition.onspeechend = function() {
                restaurarBotonVoz();
            };
        }

        function restaurarBotonVoz() {
            const btnVoz = document.getElementById('btnVoz');
            btnVoz.classList.remove('animar-voz', 'bg-red-500');
            btnVoz.innerHTML = "🎙️ Hablar";
        }

        function reproducirVoz(texto) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel(); // Detener voz anterior si la hay
            
            // Limpiar emojis para que la voz no los lea raro
            const textoLimpio = texto.replace(/[\u{1F000}-\u{1F9FF}[:emoji:]]/gu, '');
            const utterance = new SpeechSynthesisUtterance(textoLimpio);
            utterance.lang = 'es-ES';
            utterance.rate = 0.95; // Ligeramente más pausado para niños
            utterance.pitch = 1.2;  // Tono un poco más amigable/infantil
            
            window.speechSynthesis.speak(utterance);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
